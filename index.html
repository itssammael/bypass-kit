    <script type="module" src="/src/renderer.js"></script>
      <script>
        let isUploadToggled = false;
        const NEW_BTN ={
          new_resubmit : 'button.btn.btn-secondary',
          resubmit_as_new: 'button.btn.btn-warning'
        }
        document.getElementById('toggleBtn').addEventListener('click', (e) => {
          isUploadToggled = !isUploadToggled;
          e.target.innerText = isUploadToggled ? "Hide Upload BTN" : "Show Upload BTN";
          var container = document.getElementById('na-tools');
          isUploadToggled ? container.classList.remove('hidden') : container.classList.add('hidden');

        });
        
        document.getElementById('new_resubmit').addEventListener('click', () => {
          window.api.triggerRemoteUpdate('new_resubmit');
        });

        document.getElementById('resubmit_as_new').addEventListener('click', () => {
          window.api.triggerRemoteUpdate('resubmit_as_new');
        });
        document.getElementById('bypassBtn').addEventListener('click', () => {
          window.api.triggerBypassScript();
        })

        document.getElementById('reloadBtn').addEventListener('click', () => {
          window.api.triggerReload();
        })
        
        const convertBase64 = (file) => {
          return new Promise((resolve, reject) => {
            const fileReader = new FileReader();
            // Use readAsDataURL to encode the file data as a Base64 data URL
            fileReader.readAsDataURL(file);

            fileReader.onload = () => {
              resolve(fileReader.result); // The result is a data URL (e.g., data:image/png;base64,...)
            };

            fileReader.onerror = (error) => {
              reject(error);
            };
          });
        };
        const convertFileToBase64 = async (fileInput) => {
      
          const file = fileInput;
          var result = {
            base64 : '',
            message: '',
            success: false,
          };

          if (file) {
            try {
              const base64String = await convertBase64(file);
              const base64Data = base64String.split(',')[1];
              
            //  base64Output.value = base64Data; // full Data URL
              
              result.base64 = base64Data; // just the Base64 string
              result.message = "Image Converted to Base64";
              result.success = true;

            } catch (error) {
              console.error("Error converting file to Base64:", error);
                result.message = "Error converting file.";
            }
              return result;
          } else {
              result.message = "Please select a file.";
              return result;
          }
          
        };
        
        document.getElementById('file-upload').addEventListener('change', (e) => {
          var selectedFile = e.target.files[0]
          var filename_str = document.getElementById('file-name');
          filename_str.textContent = selectedFile.name;

            convertFileToBase64(selectedFile).then((ev)=>{
              window.api.triggerOverrideImgScript(JSON.stringify(ev))
            });
        });

        window.api.onAppRunResult((message) => {
            document.getElementById('result').innerText = message;
        });
    </script>
