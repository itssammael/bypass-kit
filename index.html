<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Tool</title>
    <link href="/src/index.css" rel="stylesheet">
  </head>
  <body class="flex flex-col px-3 py-6 h-full bg-gray-600">
    <div class="flex-grow h-full">
      <div class="mb-4 text-white text-center">
        <h1 class="text-3xl font-bold underline uppercase">Support Tool</h1>
      </div>
      <div class="mb-3 text-white">
        <p class="text-left">
          <span class="text-md font-bold uppercase underline">Account</span>
        </p>
        <p>
          <span class="text-xs font-bold uppercase">email: </span> <span id="u-email" class="text-sm ml-3">brionesmedical@gmail.com</span> <span id="copy-email" class="copy-icon text-lg cursor-pointer" title="Copy Email">📋</span>
        </p>
        <p>
          <span class="text-xs font-bold uppercase">password: </span><span id="u-pw" class="text-sm ml-3">y7#Qz#Z6</span> <span id="copy-pw" class="copy-icon text-lg cursor-pointer" title="Copy Password">📋</span>
        </p>
      </div>
      <hr>
      <div class="mb-3 text-white">
        <p>
          <span class="text-md font-semibold uppercase underline">BYPASS MEDICAL APP</span> 
        </p>
      </div>
      <div class="flex justify-evenly mb-3">
        <button id="bypassBtn" class="bg-indigo-400 w-3/4 font-bold text-sm uppercase p-2 rounded-sm cursor-pointer">Run Bypass</button>
      </div>
       <div class="flex justify-evenly mb-3">
        <button id="reloadBtn" class="bg-blue-400 w-3/4 font-bold text-sm uppercase p-2 rounded-sm cursor-pointer">Reload LTMS</button>
      </div>
      <hr>
      <div class="mb-3 text-white">
        <h2 class="text-md font-semibold underline uppercase">Steps:</h2>
      </div>
      <div class="mb-3 text-white">
        <p>
          <span class="text-md font-regular uppercase">1: </span>Proceed with an Client Evaluation but don't submit.
        </p>
      </div>
      <div class="mb-3 text-white">
        <p>
          <span class="text-md font-regular uppercase">2: </span>Click the button below for Appointment type.
        </p>
      </div>
      <div class="flex justify-evenly space-x-3 mb-3">
        <button class="copyBtn w-1/2 bg-green-400 font-bold text-sm uppercase p-2 rounded-sm cursor-pointer" id="new_resubmit">new</button>
        <button class="copyBtn w-1/2 bg-amber-400 font-bold text-sm uppercase p-2 rounded-sm cursor-pointer text-gray-100" id="resubmit_as_new">re-evaluate</button>
      </div>

      
      <div class="mb-3 text-white">
        <p>
          <span class="text-md font-regular uppercase">3: </span> Wait for Success Message.
        </p>
      </div>
      
      <hr>
      <div class="mb-3 text-white">
        <p class="text-left">
          <span class="text-md font-semibold underline uppercase">FOR NO APPEARANCE </span> 
        </p>
      </div>
      <div class="flex flex-col items-center justify-evenly mb-3 space-y-3">
        <button id="toggleBtn" class="bg-indigo-400 w-3/4 font-bold text-sm uppercase p-2 rounded-sm cursor-pointer">Show Upload method</button>
        <input type="password" id="fu-lock" class="bg-white text-700 h-8 w-3/4 border-black rounded px-2 hidden" placeholder="Type Master Key for NA Clients">
      </div>
      <div id="na-tools" class="hidden">
      
      <div class="flex flex-col justify-evenly mb-3">
        <span id="file-name" class="text-gray-400 italic text-sm">No file chosen</span>

       <input type="file" id="file-upload" accept="image/jpeg" name="file-upload" class="hidden">
        <label for="file-upload" class="cursor-pointer bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 uppercase text-center">
          Upload File
        </label>
        
      </div> 
      </div>
      <p id="result"></p>
    </div>
    <script type="module" src="/src/renderer.js"></script>
      <script>
        let isUploadToggled = false;
        const NEW_BTN ={
          new_resubmit : 'button.btn.btn-secondary',
          resubmit_as_new: 'button.btn.btn-warning'
        }
        document.getElementById('toggleBtn').addEventListener('click', (e) => {
          isUploadToggled = !isUploadToggled;
          e.target.innerText = isUploadToggled ? "Hide Upload BTN" : "Show Upload BTN";
          
          var container = document.getElementById('fu-lock');
          isUploadToggled ? container.classList.remove('hidden') : container.classList.add('hidden');

        });
        document.getElementById('fu-lock').addEventListener('input', (e) => {
         window.api.validateMasterKey(e.target.value)

        });
        window.api.showUploadInput((isValidated)=> {
          var container = document.getElementById('na-tools');
          var pwBox = document.getElementById('fu-lock')
          isValidated && (container.classList.remove('hidden'),pwBox.classList.add('hidden') );
           document.getElementById('result').innerText = `✅ Mastery Key approved!${isValidated}`
        })
        document.getElementById('new_resubmit').addEventListener('click', () => {
          window.api.triggerRemoteUpdate('new_resubmit');
        });

        document.getElementById('resubmit_as_new').addEventListener('click', () => {
          window.api.triggerRemoteUpdate('resubmit_as_new');
        });
        document.getElementById('bypassBtn').addEventListener('click', () => {
          window.api.triggerBypassScript();
        })

        document.getElementById('reloadBtn').addEventListener('click', () => {
          window.api.triggerReload();
        })
        
        const convertBase64 = (file) => {
          return new Promise((resolve, reject) => {
            const fileReader = new FileReader();
            // Use readAsDataURL to encode the file data as a Base64 data URL
            fileReader.readAsDataURL(file);

            fileReader.onload = () => {
              resolve(fileReader.result); // The result is a data URL (e.g., data:image/png;base64,...)
            };

            fileReader.onerror = (error) => {
              reject(error);
            };
          });
        };
        const convertFileToBase64 = async (fileInput) => {
      
          const file = fileInput;
          var result = {
            base64 : '',
            message: '',
            success: false,
          };

          if (file) {
            try {
              const base64String = await convertBase64(file);
              const base64Data = base64String.split(',')[1];
              
            //  base64Output.value = base64Data; // full Data URL
              
              result.base64 = base64Data; // just the Base64 string
              result.message = "Image Converted to Base64";
              result.success = true;

            } catch (error) {
              console.error("Error converting file to Base64:", error);
                result.message = "Error converting file.";
            }
              return result;
          } else {
              result.message = "Please select a file.";
              return result;
          }
          
        };
        
        document.getElementById('file-upload').addEventListener('change', (e) => {
          var selectedFile = e.target.files[0]
          var filename_str = document.getElementById('file-name');
          filename_str.textContent = selectedFile.name;

            convertFileToBase64(selectedFile).then((ev)=>{
              window.api.triggerOverrideImgScript(JSON.stringify(ev))
            });
        });
        document.getElementById('copy-email').addEventListener('click', function() {
            // 1. Get the text content from the email span
            const emailText = document.getElementById('u-email').innerText;
            // 2. Use the Clipboard API to copy it
            copyToClipboard(this, emailText);
        });
        document.getElementById('copy-pw').addEventListener('click', function() {
            // 1. Get the text content from the email span
            const emailText = document.getElementById('u-pw').innerText;
            // 2. Use the Clipboard API to copy it
            copyToClipboard(this, emailText);
        });
        const copyToClipboard = (e, target) => {
          navigator.clipboard.writeText(target).then(() => {
                // 3. Optional: Provide user feedback (Visual cue)
                const icon = e;
                const originalIcon = icon.innerText;
                
                icon.innerText = '✅ Copied'; // Change icon temporarily
                icon.style.color = '#22c55e'; // Optional: change color to green

                setTimeout(() => {
                    icon.innerText = originalIcon;
                    icon.style.color = ''; // Reset color
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
        window.api.onAppRunResult((message) => {
            document.getElementById('result').innerText = message;
        });
        
    </script>
  </body>
</html>
